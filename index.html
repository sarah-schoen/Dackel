<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17181b">
<title>Dackel Companion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desktop" class="desktop">
  <div class="desktop-glow"></div>

  <div id="bubble" class="speech hidden">
    <span id="bubbleText"></span>
    <i></i>
  </div>

  <div id="petWorld" class="pet-world">
    <div id="shadow" class="shadow"></div>
    <button id="pet" class="pet" aria-label="Dackel">
      <img src="assets/dackel.png" alt="Dackel">
    </button>
  </div>

  <div id="tinyBadge" class="tiny-badge">🐾</div>

  <section id="chatPanel" class="chat-panel hidden">
    <header>
      <div>
        <div class="mini-title">DACKEL</div>
        <h1>Hey there 🐶</h1>
      </div>
      <button id="closeChat" class="close">×</button>
    </header>

    <div id="status" class="status"><span></span> Hanging out quietly.</div>
    <div id="messages" class="messages"></div>

    <form id="chatForm">
      <input id="chatInput" maxlength="300" autocomplete="off" placeholder="Talk to me…">
      <button>Send</button>
    </form>

    <nav class="actions">
      <button data-action="water">💧 Water</button>
      <button data-action="stretch">🐾 Stretch</button>
      <button data-action="break">☕ Break</button>
      <button data-action="quiet">🤫 Quiet</button>
    </nav>
  </section>

  <div id="settings" class="settings hidden">
    <div class="settings-head">
      <strong>Dackel settings</strong>
      <button id="closeSettings" class="close">×</button>
    </div>
    <label>Visit frequency
      <select id="visitFrequency">
        <option value="5">5 min</option><option value="10">10 min</option>
        <option value="15">15 min</option><option value="30">30 min</option>
        <option value="60">1 hour</option>
      </select>
    </label>
    <label>Water reminder
      <select id="waterFrequency">
        <option value="30">30 min</option><option value="45">45 min</option>
        <option value="60">1 hour</option><option value="90">90 min</option>
        <option value="120">2 hours</option>
      </select>
    </label>
    <label class="check"><input id="checkins" type="checkbox"> Check-ins</label>
    <label class="check"><input id="water" type="checkbox"> Water reminders</label>
  </div>

  <button id="settingsButton" class="settings-button" aria-label="Settings">⚙︎</button>
</div>
<script src="app.js"></script>
</body>
</html>
