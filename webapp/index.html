<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f2ed">
  <title>Dackel Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app">
    <section class="pet-stage" aria-label="Dackel companion">
      <div id="bubble" class="bubble hidden">
        <div id="bubbleText"></div>
      </div>

      <button id="petButton" class="pet-button" aria-label="Talk to Dackel">
        <img id="pet" src="assets/dackel.png" alt="Dackel">
      </button>

      <div class="ground-shadow"></div>
    </section>

    <section id="fullPanel" class="full-panel">
      <header class="header">
        <div>
          <div class="eyebrow">DACKEL COMPANION</div>
          <h1>Hi! 🐾</h1>
        </div>
        <button id="closeButton" class="icon-button" aria-label="Close">×</button>
      </header>

      <div class="chat-title-row"><div class="chat-avatar-wrap"><img src="assets/dackel.png" class="chat-avatar" alt="Dackel"></div><div><strong>Dackel</strong><div class="chat-subtitle">dein kleiner Büro-Buddy</div></div></div>

      <div class="status-row">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Just hanging out.</span>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="empty-chat hidden" id="emptyChat">Your little companion is here. 🐾</div>
      </div>
      <div id="typingIndicator" class="typing hidden" aria-live="polite">
        <img src="assets/dackel.png" alt="" class="typing-avatar">
        <div class="typing-bubble"><span></span><span></span><span></span></div>
        <span class="typing-label">Dackel denkt …</span>
      </div>

      <form id="chatForm" class="chat-form">
        <input id="chatInput" autocomplete="off" maxlength="300"
               placeholder="Say something to me…">
        <button type="submit">Send</button>
      </form>

      <div class="quick-actions">
        <button data-action="water">💧 Water</button>
        <button data-action="stretch">🐾 Stretch</button>
        <button data-action="break">☕ Break</button>
        <button data-action="quiet">🤫 Quiet</button>
      </div>

      <details class="settings">
        <summary>Settings</summary>
        <label>Visit frequency
          <select id="visitFrequency">
            <option value="5">5 min</option>
            <option value="10">10 min</option>
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="60">1 hour</option>
          </select>
        </label>
        <label>Water reminder
          <select id="waterFrequency">
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60">1 hour</option>
            <option value="90">90 min</option>
            <option value="120">2 hours</option>
          </select>
        </label>
        <label class="toggle">
          <input id="checkinsEnabled" type="checkbox" checked>
          <span>Check-ins</span>
        </label>
        <label class="toggle">
          <input id="waterEnabled" type="checkbox" checked>
          <span>Water reminders</span>
        </label>
      </details>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
